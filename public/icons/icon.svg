<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A9B"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFEEEE"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 角丸背景 -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- ハート（中央寄せ、シャドウつき） -->
  <g filter="url(#softShadow)">
    <path d="M 256 422
             C 256 422, 86 312, 86 198
             C 86 138, 132 100, 182 100
             C 220 100, 248 122, 256 152
             C 264 122, 292 100, 330 100
             C 380 100, 426 138, 426 198
             C 426 312, 256 422, 256 422 Z"
          fill="url(#heart)"/>
  </g>

  <!-- 心拍ライン（ハートを横切る） -->
  <path d="M 96 256
           L 184 256
           L 208 210
           L 238 326
           L 270 160
           L 300 296
           L 324 256
           L 416 256"
        stroke="#FF4D6D"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
</svg>
